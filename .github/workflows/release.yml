name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev
        working-directory: pos

      - name: Build (${{ matrix.target }})
        run: npx electron-builder --${{ matrix.target }} --publish never
        working-directory: pos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pos-${{ matrix.target }}
          path: |
            pos/dist/*.exe
            pos/dist/*.AppImage
            pos/dist/*.blockmap
          if-no-files-found: warn

      - name: Attach to release
        if: ${{ matrix.target == 'win' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mero Dev POS ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            pos/dist/*.exe
            pos/dist/*.AppImage
            pos/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
